name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - mykb

    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Build ZMK firmware
        uses: urob/zmk-actions/build-user-config@v2
        with:
          config_path: .
          board: ${{ matrix.board }}
          cmake_args: -DBOARD_ROOT=${{ github.workspace }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-firmware
          path: ./build/artifacts/*.uf2
