name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 这里保持你build.yaml里的配置，先测试corne
          - board: nice_nano_v2
            shield: corne_left
          - board: nice_nano_v2
            shield: corne_right
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: config

      - name: Initialize workspace
        run: |
          west init -l config
          cd zmk
          west update --narrow  # 核心：只拉取必需模块，跳过hal_wch等无关仓库
          west zephyr-export

      - name: Build ${{ matrix.board }} / ${{ matrix.shield }}
        run: |
          west build -s zmk/app -d build/${{ matrix.board }}-${{ matrix.shield }} -b ${{ matrix.board }} -- -DSHIELD=${{ matrix.shield }} -DZMK_CONFIG=${{ github.workspace }}/config/config

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.shield }}
          path: build/${{ matrix.board }}-${{ matrix.shield }}/zephyr/*.uf2
