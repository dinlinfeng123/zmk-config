manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import:
        file: app/west.yml
        # 关键点：board-root指向仓库根目录的boards文件夹
        board-root: "../boards"

  self:
    path: .
    
